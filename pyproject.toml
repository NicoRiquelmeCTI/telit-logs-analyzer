[tool.poetry]
name = "connectivity-analyzer"
version = "1.1.0"
description = "Connectivity Analyzer for Log Files"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "connectivity_analyzer", from = "src"}]  # Actualizado para usar src/

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
numpy = "^1.24.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
python-multipart = "^0.0.6"
jinja2 = "^3.1.2"
plotly = "^5.18.0"
dash = "^2.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.9.1"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
analyze-connectivity = "scripts.analyze_log:main"  # Actualizado para usar el nuevo script